[package]
name = "rinha-samuelpanzera-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
may_minihttp = "0.1.11"
may = { version = "0.3.51", default-features = false }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
hostname = "0.4.1"
chrono = { version = "0.4.38", features = ["serde"] }

uuid = { version = "1.17", features = ["v4", "serde"] }
rust_decimal = { version = "1.37.2", features = ["serde"] }

rusqlite = { version = "0.37.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"

[profile.release]
opt-level = 3