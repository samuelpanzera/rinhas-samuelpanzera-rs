#CPU_MAX = 1.5
#MEMORY_MAX = 350MB 

services: 
  api1: &api-base
    build: .
    hostname: "api-1"
    environment:
      - SERVER_ID=api-1
      - PORT=1313 
    networks:
     - backend-rs
     - payment-processor
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: "135M"
  api2: 
    <<: *api-base
    hostname: "api-2"
    environment:
      - SERVER_ID=api-2
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "1313:80"
    depends_on:
      app1:
        condition: service_started
      api2:
        condition: service_started
    networks:
      - backend-rs
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 80M # 55Mb é suficiente? 
networks:
  backend-rs:
    driver: bridge
  payment-processor:
    external: true